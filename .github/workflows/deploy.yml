name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 手動でも実行できるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続でpushしたときは最新のものだけをデプロイする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 壊れたものをホールに持ち込まないよう、デプロイ前に必ず検証する
      - name: 型チェック
        run: npm run typecheck

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
